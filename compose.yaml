services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: tockrplatform:local
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - platform-data:/var/lib/tockrplatform
    ports:
      - "8080:8080"
    environment:
      PLATFORM_HTTP_ADDR: ":8080"
      PLATFORM_DB_PATH: /var/lib/tockrplatform/platform.db
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?PLATFORM_MFA_KEY must be set}
      PLATFORM_ASSERTION_ISSUER: ${PLATFORM_ASSERTION_ISSUER:?PLATFORM_ASSERTION_ISSUER must be set}
      PLATFORM_ASSERTION_KEY_ID: ${PLATFORM_ASSERTION_KEY_ID:?PLATFORM_ASSERTION_KEY_ID must be set}
      PLATFORM_ASSERTION_PRIVATE_KEY: ${PLATFORM_ASSERTION_PRIVATE_KEY:?PLATFORM_ASSERTION_PRIVATE_KEY must be set}
      PLATFORM_ASSERTION_AUDIENCES: ${PLATFORM_ASSERTION_AUDIENCES:?PLATFORM_ASSERTION_AUDIENCES must be set}
      PLATFORM_ASSERTION_VERIFY_KEYS: ${PLATFORM_ASSERTION_VERIFY_KEYS:-}

volumes:
  platform-data:
